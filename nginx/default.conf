# Reverse proxy for the whole stack (HTTP). For TLS see nginx/production.conf.example.
#   /api/*  -> API (Express)      everything else -> web (Next.js)

# Brute-force guard for the login endpoint on top of the API's own limiter.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

upstream web { server web:3100; keepalive 16; }
upstream api { server api:4000; keepalive 16; }

# Behind a CDN/load balancer, replace the lines below with real_ip_header + set_real_ip_from.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 100k;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Always overwrite (never append) so visitors cannot spoof the IP the API rate-limits on.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    limit_req zone=general burst=60 nodelay;

    # Internal-only endpoints: the API and web app call these directly over the Docker network.
    location = /api/revalidate { return 404; }

    location = /api/admin/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
    }

    location /api/ { proxy_pass http://api; }

    # Immutable build assets
    location /_next/static/ {
        proxy_pass http://web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / { proxy_pass http://web; }
}

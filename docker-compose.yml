# Whole stack:  cp .env.example .env  (fill the secrets, see docs/DEPLOYMENT.md)  &&  docker compose up -d --build
# Development only needs the database:  docker compose up -d mongo

x-restart: &restart
  restart: unless-stopped
  # Docker's default log driver never rotates; cap it so a small server's disk cannot fill up.
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  mongo:
    <<: *restart
    image: mongo:7
    user: mongodb # skip the entrypoint's gosu step, which hangs on some hosts
    # Not published to the host by default. To use it from `pnpm dev`, run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mongo
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *restart
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { mongo: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/aimag
      API_PORT: 4000
      # Public URL of the site (browser origin) and the internal address of the web container.
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${SITE_URL:-http://localhost:8080}
      WEB_URL: http://web:3100
      TRUST_PROXY_HOPS: 1 # nginx in front
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET (32+ random characters)}
      SCRAPER_CONTACT_EMAIL: ${SCRAPER_CONTACT_EMAIL:?set SCRAPER_CONTACT_EMAIL (shown to the source site in the User-Agent)}
      SCRAPER_SECTIONS: ${SCRAPER_SECTIONS:-news,articles}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_CRON: ${SCHEDULER_CRON:-0 */6 * * *}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      IMAGE_MODE: ${IMAGE_MODE:-hotlink}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_API_URL: ${SITE_URL:-http://localhost:8080} # same origin: nginx routes /api/ to the API
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-editor@example.com}
    depends_on: { api: { condition: service_healthy } }
    environment:
      API_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      IMAGE_OPTIMIZE: ${IMAGE_OPTIMIZE:-false}

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    depends_on: { web: { condition: service_healthy }, api: { condition: service_healthy } }
    ports: ['${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']

volumes:
  mongo-data:

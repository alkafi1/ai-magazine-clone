name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: catches newly published dependency advisories

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aimag/shared build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright browser
        run: pnpm --filter @aimag/web exec playwright install --with-deps chromium
      - name: 'E2E (isolated stack - test DB, API on 4010, production web build on 3110)'
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t synthwire-api .
      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile -t synthwire-web
          --build-arg NEXT_PUBLIC_SITE_URL=https://example.com
          --build-arg NEXT_PUBLIC_API_URL=https://example.com
          --build-arg NEXT_PUBLIC_CONTACT_EMAIL=editor@example.com .
      - name: Validate compose file and nginx config
        run: |
          JWT_SECRET=x REVALIDATE_SECRET=y SCRAPER_CONTACT_EMAIL=ci@example.com docker compose config -q
          docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
